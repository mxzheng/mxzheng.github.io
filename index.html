document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

7d5411;\n  --color-accent-800: #5a3b0a;\n  --color-accent-900: #3a270d;\n\n  --color-accent-2-100: #fff3e4;\n  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n  <script src=\"da1d1d25-aec7-460a-a861-c513b8a2c30c\"><\u002Fscript>\n  <style>\n    body { margin: 0; background: #ffffff; color: #201f1d; font-family: \"Lora\", system-ui, serif; }\n    a { color: #7d5411; text-underline-offset: 3px; text-decoration-thickness: 1px; }\n    a:hover { color: #b68235; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; display:flex; flex-direction:column;\">\n  <nav class=\"nav\" style=\"display:flex; align-items:center; gap:27.6px; padding:13.8px 27.6px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); position:sticky; top:0; background:#ffffff; z-index:2;\">\n    <a href=\"#top\" class=\"nav-brand\" style=\"font-family:'Cormorant Garamond', serif; font-weight:600; font-size:20px; margin-right:auto; color:#201f1d; text-decoration:none;\">Mengxin Zheng<\u002Fa>\n    <a href=\"#research\" style=\"color:inherit; text-decoration:none; font-size:14px;\">Research<\u002Fa>\n    <a href=\"#news\" style=\"color:inherit; text-decoration:none; font-size:14px;\">News<\u002Fa>\n    <a href=\"#publications\" sc-camel-on-click=\"{{ openPubs }}\" style=\"color:inherit; text-decoration:none; font-size:14px;\">Publications<\u002Fa>\n    <a href=\"#students\" style=\"color:inherit; text-decoration:none; font-size:14px;\">Students<\u002Fa>\n    <a href=\"#teaching\" style=\"color:inherit; text-decoration:none; font-size:14px;\">Teaching<\u002Fa>\n    <a href=\"#service\" style=\"color:inherit; text-decoration:none; font-size:14px;\">Service<\u002Fa>\n    <a href=\"https://drive.google.com/file/d/1aeeayiVpuXJYh-b46X1bAtWwBH5f8cde/view?usp=drive_link\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit; text-decoration:none; font-size:14px;\">CV<\u002Fa>\n  <\u002Fnav>\n\n  <main id=\"top\" style=\"width:100%; max-width:1040px; margin:0 auto; padding:55px 27.6px 73px; display:flex; flex-direction:column; gap:55px; box-sizing:border-box;\">\n\n    <!-- Hero -->\n    <header style=\"display:grid; grid-template-columns:minmax(200px, 240px) minmax(0,1fr); gap:36.8px; align-items:start;\">\n      <figure style=\"margin:0;\">\n        <img class=\"plate\" src=\"c256979e-42ab-4bce-8b69-e83a338ba9ef\" alt=\"Portrait of Mengxin Zheng\" style=\"width:100%; aspect-ratio:4/5; object-fit:cover; display:block;\">\n        <figcaption style=\"font-size:11px; margin-top:6px; color:color-mix(in srgb, #201f1d 55%, transparent); text-align:center;\">Orlando, Florida<\u002Ffigcaption>\n      <\u002Ffigure>\n      <div style=\"display:flex; flex-direction:column; gap:18.4px; min-width:0;\">\n        <p style=\"margin:0; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#b68235; font-variant-numeric:tabular-nums;\">Assistant Professor · Computer Science · University of Central Florida<\u002Fp>\n        <p style=\"margin:0; font-size:16px; line-height:1.65; text-align:justify; text-wrap:pretty; hyphens:auto;\">Mengxin Zheng is an Assistant Professor of Computer Science at the University of Central Florida, where she is a member of the Cybersecurity and Privacy Cluster and the Quantum Initiative. She received her Ph.D. in Intelligent Systems Engineering from Indiana University Bloomington in 2023. Her research focuses on trustworthy AI at the intersection of machine learning security, data privacy, privacy-preserving computation, and secure cyberinfrastructure, with emerging interests in quantum security. Her work has been supported by NSF and NIH. Dr. Zheng was recognized as a 2026 DAC Outstanding TPC Member and a 2023 DAC Young Fellow, and received the 2023 SPIE Best Student Paper Award. Her research has appeared in leading venues including NeurIPS, ICLR, ACL, NAACL, EMNLP, CVPR, ECCV, DAC, and ASPLOS.<\u002Fp>\n        <div style=\"display:flex; flex-wrap:wrap; gap:9.2px; margin-top:4.6px;\">\n          <a class=\"btn btn-primary\" href=\"mailto:mengxin.zheng@ucf.edu\" style=\"text-decoration:none;\">mengxin.zheng@ucf.edu<\u002Fa>\n          <a class=\"btn btn-secondary\" href=\"https://scholar.google.com/citations?user=CwLrXMAAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;\">Google Scholar<\u002Fa>\n          <a class=\"btn btn-secondary\" href=\"https://www.linkedin.com/in/mengxin-zheng-86bb91171\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none;\">LinkedIn<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fheader>\n\n    <sc-if value=\"{{ showOpenings }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:1px solid #b68235; border-radius:4px; padding:13.8px 18.4px; font-size:14px; line-height:1.6; text-align:justify;\">\n        <span style=\"font-family:'Cormorant Garamond', serif; font-weight:600; font-size:18px; color:#7d5411; margin-right:8px;\">Openings.<\u002Fspan>\n        I have fully funded Ph.D. positions available. Please see the <a href=\"https://www.ucf.edu/degree/computer-science-phd/\" target=\"_blank\" rel=\"noopener\">UCF CS Ph.D. program<\u002Fa> and <a href=\"https://graduate.ucf.edu/application-deadlines-and-requirements/doctoral/2025/#computer-science-phd\" target=\"_blank\" rel=\"noopener\">application requirements<\u002Fa>, and send your CV and transcript to me by email.\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- Research -->\n    <section id=\"research\" style=\"display:flex; flex-direction:column; gap:18.4px; padding-top:18.4px;\">\n      <h2 style=\"margin:0; padding-bottom:9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-family:'Cormorant Garamond', serif; font-weight:600; font-size:30px; line-height:1.1;\">Research<\u002Fh2>\n      <p style=\"margin:0; font-size:16px; line-height:1.65; text-align:justify; text-wrap:pretty; hyphens:auto;\">My research builds <strong style=\"font-weight:600;\">trustworthy AI across the model-to-hardware stack<\u002Fstrong> — securing machine-learning models and agents, protecting the data they learn from, making privacy-preserving computation practical, and extending these guarantees to quantum computing. A full list of publications is available <a href=\"#publications\">here<\u002Fa>.<\u002Fp>\n      <ul style=\"margin:0; padding:0 0 0 22px; list-style:square; display:flex; flex-direction:column; gap:9.2px;\">\n        <sc-for list=\"{{ researchList }}\" as=\"area\" hint-placeholder-count=\"5\">\n          <li style=\"font-size:15px; line-height:1.65; text-align:left; text-wrap:pretty;\"><strong style=\"font-weight:600;\">{{ area.name }}.<\u002Fstrong> {{ area.blurb }} Representative work: <sc-for list=\"{{ area.refs }}\" as=\"r\" hint-placeholder-count=\"3\"><a href=\"{{ r.href }}\" target=\"_blank\" rel=\"noopener\" title=\"{{ r.title }}\">{{ r.name }}<\u002Fa><span>{{ r.sep }}<\u002Fspan><\u002Fsc-for><\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <!-- News -->\n    <section id=\"news\" style=\"display:flex; flex-direction:column; gap:18.4px; padding-top:18.4px;\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:9.2px 18.4px; align-items:baseline; justify-content:space-between; padding-bottom:9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent);\">\n        <h2 style=\"margin:0; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:30px; line-height:1.1;\">News<\u002Fh2>\n        <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ toggleNews }}\" style=\"font-size:13px;\">{{ newsToggleLabel }}<\u002Fbutton>\n      <\u002Fdiv>\n      <ul style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column;\">\n        <sc-for list=\"{{ newsItems }}\" as=\"n\" hint-placeholder-count=\"8\">\n          <li style=\"display:grid; grid-template-columns:72px minmax(0,1fr); gap:18.4px; padding:9.2px 0; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-size:14px; line-height:1.55;\">\n            <span style=\"font-variant-numeric:tabular-nums; color:color-mix(in srgb, #201f1d 55%, transparent); font-size:12px; padding-top:2px; letter-spacing:0.04em;\">{{ n.date }}<\u002Fspan>\n            <span style=\"text-wrap:pretty;\"><span class=\"tag\" style=\"font-size:10px; letter-spacing:0.08em; text-transform:uppercase; margin-right:8px; vertical-align:middle; min-width:56px; justify-content:center; background:{{ n.tagBg }}; color:{{ n.tagColor }};\">{{ n.kind }}<\u002Fspan>{{ n.text }}<sc-if value=\"{{ n.href }}\" hint-placeholder-val=\"{{ false }}\"> <a href=\"{{ n.href }}\" target=\"_blank\" rel=\"noopener\" style=\"font-weight:600; color:#7d5411;\">{{ n.linkText }}<\u002Fa><\u002Fsc-if><sc-if value=\"{{ n.plainStrong }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-weight:600; color:#7d5411;\">{{ n.linkText }}<\u002Fspan><\u002Fsc-if>{{ n.tail }}<\u002Fspan>\n          <\u002Fli>\n        <\u002Fsc-for>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <!-- Publications -->\n    <section id=\"publications\" style=\"display:flex; flex-direction:column; gap:18.4px; padding-top:18.4px;\">\n      <div style=\"display:flex; flex-wrap:wrap; gap:9.2px 18.4px; align-items:baseline; justify-content:space-between; padding-bottom:9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent);\">\n        <h2 style=\"margin:0; font-family:'Cormorant Garamond', serif; font-weight:600; font-size:30px; line-height:1.1;\">Publications<\u002Fh2>\n        <span style=\"display:flex; gap:9.2px;\"><button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ togglePubs }}\" style=\"font-size:13px;\">{{ pubsToggleLabel }}<\u002Fbutton>\n        <a class=\"btn btn-ghost\" href=\"https://scholar.google.com/citations?user=CwLrXMAAAAAJ&amp;hl=en\" target=\"_blank\" rel=\"noopener\" style=\"font-size:13px; text-decoration:none;\">Google Scholar →<\u002Fa><\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:27.6px;\">\n        <sc-if value=\"{{ pubsCollapsed }}\" hint-placeholder-val=\"{{ true }}\">\n          <ol style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ recentPubs }}\" as=\"p\" hint-placeholder-count=\"5\">\n              <li style=  <div style=\"display:flex; flex-direction:column;\">\n            <h3 style=\"margin:0 0 4.6px; font-family:'Cormorant Garamond', serif; font-weight:400; font-size:34px; line-height:1; color:#b68235; font-variant-numeric:tabular-nums; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); padding-bottom:9.2px;\">{{ y.year }}<\u002Fh3>\n            <ol style=\"margin:0; padding:0; list-style:none; display:flex; flex-direction:column;\">\n              <sc-for list=\"{{ y.items }}\" as=\"p\" hint-placeholder-count=\"4\">\n                <li style=\"display:grid; grid-template-columns:96px minmax(0,1fr); gap:18.4px; padding:13.8px 0; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent);\">\n                  <span style=\"font-family:'Cormorant Garamond', serif; font-size:15px; color:#7d5411; font-variant-numeric:tabular-nums; padding-top:3px; line-height:1.3;\"><sc-if value=\"{{ p.preprint }}\" hint-placeholder-val=\"{{ false }}\"><em style=\"color:color-mix(in srgb, #201f1d 55%, transparent);\">{{ p.venue }}<\u002Fem><\u002Fsc-if><sc-if value=\"{{ p.published }}\" hint-placeholder-val=\"{{ true }}\">{{ p.venue }}<\u002Fsc-if><\u002Fspan>\n                  <div style=\"display:flex; flex-direction:column; gap:4px; min-width:0;\">\n                    <div style=\"font-family:'Cormorant Garamond', serif; font-weight:600; font-size:19px; line-height:1.25; text-wrap:pretty;\">\n                      <sc-if value=\"{{ p.href }}\" hint-placeholder-val=\"{{ true }}\"><a href=\"{{ p.href }}\" target=\"_blank\" rel=\"noopener\" style=\"color:inherit; text-decoration:none;\" style-hover=\"color:#b68235;\">{{ p.title }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ p.noHref }}\" hint-placeholder-val=\"{{ false }}\"><span>{{ p.title }}<\u002Fspan><\u002Fsc-if>\n                      <sc-if value=\"{{ p.note }}\" hint-placeholder-val=\"{{ false }}\"> <span class=\"tag tag-outline\" style=\"font-family:'Lora', serif; font-weight:4 nsparent);\">DAC 2026 Young Fellow · 2024 ORGRC Fellowship<\u002Fp>\n            <p style=\"margin:2px 0 0; font-size:13px; line-height:1.5; color:#7d5411; font-variant-numeric:tabular-nums;\">{{ pubsZhao }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li style=\"display:grid; grid-template-columns:96px minmax(0,1fr); gap:18.4px; padding:13.8px 0; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent);\">\n          <span style=\"font-variant-numeric:tabular-nums; color:color-mix(in srgb, #201f1d 55%, transparent); font-size:12px; padding-top:4px; letter-spacing:0.04em;\">Fall 2025 –<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:4px; min-width:0;\">\n            <div style=\"font-family:'Cormorant Garamond', serif; font-weight:600; font-size:19px; line-height:1.25;\">Nokimul Hasan Arif <span style=\"font-family:'Lora', serif; font-weight:400; font-size:13px; color:color-mix(in srgb, #201f1d 55%, transparent); margin-left:6px;\">Ph.D. student<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:0; font-size:13px; line-height:1.5; color:color-mix(in srgb, #201f1d 70%, transparent);\">2025 ORGRC Fellowship<\u002Fp>\n            <p style=\"margin:2px 0 0; font-size:13px; line-height:1.5; color:#7d5411; font-variant-numeric:tabular-nums;\">{{ pubsArif }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li style=\"display:grid; grid-template-columns:96px minmax(0,1fr); gap:18.4px; padding:13.8px 0; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent);\">\n          <span style=\"font-variant-numeric:tabular-nums; color:color-mix(in srgb, #201f1d 55%, transparent); font-size:12px; padding-top:4px; letter-spacing:0.04em;\">Fall 2025 –<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:4px; min-width:0;\">\n            <div style=\"font-family:'Cormorant Garamond', serif; font-weight:600; font-size:19px; line-height:1.25;\">Ahatesham Bhuiyan <span style=\"font-family:'Lora', serif; font-weight:400; font-size:13px; color:color-mix(in srgb, #201f1d 55%, transparent); margin-left:6px;\">Ph.D. student<\u002Fspan><\u002Fdiv>\n            <p style=\"margin:2px 0 0; font-size:13px; line-height:1.5; color:#7d5411; font-variant-numeric:tabular-nums;\">{{ pubsBhuiyan }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Ful>\n    <\u002Fsection>\n\n    <!-- Teaching & Experience -->\n    <section id=\"teaching\" style=\"display:flex; flex-direction:column; gap:18.4px; padding-top:18.4px;\">\n      <h2 style=\"margin:0; padding-bottom:9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-family:'Cormorant Garamond', serif; font-weight:600; font-size:30px; line-height:1.1;\">Teaching<\u002Fh2>\n      <div style=\"display:flex; flex-direction:column; gap:27.6px;\">\n        <sc-raw-table class=\"table\" style=\"width:100%; border-collapse:collapse; font-size:14px;\">\n          <sc-raw-thead>\n            <sc-raw-tr>\n              <sc-raw-th style=\"text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, #201f1d 60%, transparent); padding:9.2px 9.2px 9.2px 0; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-weight:400;\">Course<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, #201f1d 60%, transparent); padding:9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-weight:400;\">Institution<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:color-mix(in srgb, #201f1d 60%, transparent); padding:9.2px 0 9.2px 9.2px; border-bottom:1px solid color-mix(in srgb, #201f1d 16%, transparent); font-weight:400; white-space:nowrap;\">Term<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr>\n          <\u002Fsc-ra uting and serving for multi-LLM systems\", [\"HW-Router\"]],\n      [\"Hardware security of PIM accelerators\", [\"Corrosion Hammer\"]],\n    ]},\n  ];\n  shortVenue(v) {\n    const m = v.match(/^(.*?)\\s*(\\d{4})(.*)$/);\n    if (!m) return v;\n    const base = m[1].replace(\" Findings\", \"\").replace(\"Computing Frontiers\", \"CF\").trim();\n    return `${base}’${m[2].slice(2)}${m[3].trim() ? \" \" + m[3].trim() : \"\"}`;\n  }\n  blurbs = {\n    \"Quantum Security\": \"We study the adversarial robustness of variational and sample-based quantum algorithms on real hardware, and build datasets and diffusion-based initializers that make them reliable.\",\n    \"Machine Learning Security\": \"We uncover backdoor, Trojan, and prompt attacks on LLMs, vision models, and multi-agent systems, and design detection, certified-robustness, watermarking, and fingerprinting defenses.\",\n    \"AI Data Privacy Protection\": \"We make private inference, private training, and federated learning on encrypted data fast enough for real models, with verifiable and attested execution.\",\n    \"Privacy-Preserving Computation\": \"We co-design fully homomorphic encryption with electro-optical and resilient accelerators, and benchmark agentic code generation for secure computation.\",\n    \"Secure Cyberinfrastructure\": \"We build hardware-aware routing and serving for multi-LLM systems and analyze hardware security of emerging accelerators.\",\n  };\n  shortNames = [\n    [\"Hardware Robustness\", \"SQD Robustness\"], [\"Conjunctive Prompt\", \"Conjunctive Prompt Attacks\"], [\"Jailbreaking\", \"Arabizi Jailbreaks\"],\n    [\"Evaluating the Robustness\", \"Cross-Lingual Watermarking\"], [\"Factuality Beyond\", \"Medical-Text Watermarking\"], [\"SoK\", \"FHE Universality SoK\"],\n    [\"Corrosion Hammer\", \"Corrosion Hammer\"],\n  ];\n  shortName(title) {\n    const hit = this.shortNames.find(([k]) => title.startsWith(k));\n    if (hit) return hit[1];\n    const head = title.split(\":\"
